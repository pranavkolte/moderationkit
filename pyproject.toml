[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "moderationkit"
version = "0.1.0.dev0"
description = "Policy-aware text moderation with interchangeable model providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
laya = ["laya==0.4.31", "torch>=2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/moderationkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "pyproject.toml", "README.md", "LICENSE"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = ["integration: requires installed Laya and downloaded checkpoint weights"]
