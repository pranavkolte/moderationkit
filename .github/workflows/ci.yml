name: SDK checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src/moderationkit
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python -m build --installer uv
      - run: uv run --no-sync python -m twine check dist/*
      - run: |
          uv venv /tmp/core-install
          uv pip install --python /tmp/core-install/bin/python dist/*.whl
          cd /tmp
          /tmp/core-install/bin/python -c "import moderationkit, sys; assert 'laya' not in sys.modules; assert 'torch' not in sys.modules"
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      HF_HOME: /tmp/moderationkit-hf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/moderationkit-hf
          key: laya-85cc74ddae6109077ebe2853a9b3077fb6606a78
      - run: uv sync --locked --group dev --extra laya
      - run: uv run --no-sync pytest -m integration
